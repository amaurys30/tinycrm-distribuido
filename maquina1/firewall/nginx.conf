# =====================================================================
# FIREWALL perimetral (192.168.0.1 red externa / 192.168.1.1 DMZ)
# Unico punto de entrada desde la red externa. Solo deja pasar trafico
# HTTP (80) y HTTPS (443) hacia www.tiny.com y lo entrega al Middleware
# (192.168.1.5). El HTTPS termina aqui: el firewall descifra con el
# certificado de www.tiny.com y reenvia a la DMZ por HTTP.
# El resto de servicios NO es alcanzable desde la red externa porque
# solo el firewall esta conectado a ambas redes (segmentacion L3).
# =====================================================================
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    log_format fw '$remote_addr [$time_local] "$host" "$request" $status '
                  'cliente=$upstream_http_x_cliente servidor=$upstream_http_x_servidor';
    access_log /dev/stdout fw;

    server_tokens off;
    client_max_body_size 16m;

    # Reglas anti-abuso por IP de origen
    limit_req_zone  $binary_remote_addr zone=por_ip:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=conexiones:10m;

    # Metodos HTTP permitidos
    map $request_method $metodo_permitido {
        default 0;
        GET 1; HEAD 1; POST 1; PUT 1; PATCH 1; DELETE 1; OPTIONS 1;
    }

    # Parametros TLS (puerto 443)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # REGLA 1: cualquier host distinto de www.tiny.com (p.ej. acceso por IP) se descarta
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        ssl_reject_handshake on;       # HTTPS sin el nombre www.tiny.com: se corta
        server_name _;
        location = /fw-salud { access_log off; return 200 "ok\n"; }
        location / { return 444; }
    }

    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name www.tiny.com tiny.com;

        # Certificado de www.tiny.com firmado por la "Tiny CA" del proyecto
        ssl_certificate     /etc/nginx/certs/tiny.crt;
        ssl_certificate_key /etc/nginx/certs/tiny.key;

        # REGLA 2: solo metodos permitidos
        if ($metodo_permitido = 0) { return 405; }

        # REGLA 3: endpoints internos bloqueados desde el exterior
        location ~ ^/(actuator|middleware/salud) { return 403; }

        location / {
            # REGLA 4: limitacion de tasa y conexiones
            limit_req  zone=por_ip burst=100 nodelay;
            limit_conn conexiones 100;

            proxy_pass http://192.168.1.5:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            add_header X-Firewall "tiny-fw" always;
        }
    }
}
