# =====================================================================
#  MAQUINA 1  (Virtual o Fisica)  -  Red DMZ + Red Interna
#  Proyecto Final Sistemas Distribuidos 2026-2 - TinyCRM multi-cliente
#
#  Redes (se crean ANTES, a mano; ver GUIA_PASO_A_PASO.md):
#    red_externa 192.168.0.0/24  (lado externo del firewall)
#    red_dmz     192.168.1.0/24  (con salida a Internet)
#    red_interna 192.168.2.0/24  (--internal: SIN salida a Internet)
#  La Maquina 2 llega por la IP del portatil 1: puerto 53 (DNS) para
#  resolver www.tiny.com y puertos 80/443 (Firewall) para la aplicacion.
# =====================================================================
name: tiny-maquina1

x-tinycrm-base: &tinycrm-base
  image: tinycrm-sd:1.0
  build:
    context: ../tinycrm
  restart: unless-stopped
  mem_limit: 700m

x-env-comun: &env-comun
  # TinyCRM esta detras de Firewall -> Middleware -> LB: con esto Spring usa
  # X-Forwarded-Proto/Host para saber la URL REAL del usuario (http o https
  # de www.tiny.com). Sin esto, el login por https se rechazaba por CORS.
  SERVER_FORWARD_HEADERS_STRATEGY: framework
  RABBITMQ_HOST: 192.168.2.8
  RABBITMQ_USER: ${RABBITMQ_USER}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
  TZ: America/Bogota

x-env-cliente-a: &env-cliente-a
  <<: *env-comun
  TENANT_ID: A
  TENANT_NOMBRE: Cliente A
  TENANT_DOMINIO: clientea.com
  DB_URL: jdbc:mysql://192.168.2.1:3306/tinycrm_cliente_a?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  DB_USER: tinycrm_a
  DB_PASSWORD: ${DB_CLIENTE_A_PASSWORD}

x-env-cliente-b: &env-cliente-b
  <<: *env-comun
  TENANT_ID: B
  TENANT_NOMBRE: Cliente B
  TENANT_DOMINIO: clienteb.com
  DB_URL: jdbc:mysql://192.168.2.1:3306/tinycrm_cliente_b?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  DB_USER: tinycrm_b
  DB_PASSWORD: ${DB_CLIENTE_B_PASSWORD}

x-pxc-base: &pxc-base
  image: percona/percona-xtradb-cluster:8.0
  restart: unless-stopped
  mem_limit: 1g
  # Envoltura que decide crear o unirse al cluster (quita \r por si el
  # archivo se edito en Windows con finales de linea CRLF)
  entrypoint: ["bash", "-c", "tr -d '\\r' < /usr/local/bin/pxc-arranque.sh > /tmp/arranque.sh && exec bash /tmp/arranque.sh \"$$@\"", "pxc-arranque"]
  # La configuracion de MySQL/Galera la escribe pxc-arranque.sh dentro del
  # contenedor (zz-tinycrm.cnf), para que la lean mysqld Y el script de SST
  command: ["mysqld"]
  healthcheck:
    # Sano solo si el nodo esta sincronizado con el cluster (por TCP, no socket)
    test: ["CMD-SHELL", "mysql -h127.0.0.1 -P3306 --protocol=TCP -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -Nse \"SHOW GLOBAL STATUS LIKE 'wsrep_local_state_comment'\" 2>/dev/null | grep -q Synced"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 120s

x-pxc-env: &pxc-env
  MYSQL_ROOT_PASSWORD: ${PXC_ROOT_PASSWORD}
  CLUSTER_NAME: tinycrm-cluster
  PXC_PEERS: 192.168.2.10,192.168.2.11,192.168.2.12
  DB_CLIENTE_A_PASSWORD: ${DB_CLIENTE_A_PASSWORD}
  DB_CLIENTE_B_PASSWORD: ${DB_CLIENTE_B_PASSWORD}

services:

  # ------------------------------------------------------------------
  # FIREWALL (192.168.0.1 | 192.168.1.1) - unico componente expuesto:
  # recibe www.tiny.com por el puerto 80 del portatil y lo entrega al Middleware
  # ------------------------------------------------------------------
  firewall:
    image: nginx:1.27-alpine
    container_name: firewall
    hostname: firewall
    restart: unless-stopped
    volumes:
      - ./firewall/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../certificados/tiny.crt:/etc/nginx/certs/tiny.crt:ro
      - ../certificados/tiny.key:/etc/nginx/certs/tiny.key:ro
    ports:
      - "80:80"        # puerta de entrada HTTP desde la Maquina 2 (red externa)
      - "443:443"      # puerta de entrada HTTPS (certificado de www.tiny.com)
      - "53:53/udp"    # DNS: lo atiende el contenedor "dns" (comparte esta red)
      - "53:53/tcp"
    networks:
      red_externa: { ipv4_address: 192.168.0.1 }
      red_dmz:     { ipv4_address: 192.168.1.1 }
    depends_on:
      middleware: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/fw-salud"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------------
  # DNS (192.168.0.1): comparte la pila de red (misma IP) del firewall,
  # igual que en el diagrama. Responde www.tiny.com -> IP del portatil 1
  # (IP_MAQUINA1 en .env), que es la que la Maquina 2 puede alcanzar.
  # Sus puertos (53) se publican en el servicio firewall.
  # ------------------------------------------------------------------
  dns:
    build: ./dns
    image: tiny-dns:1.0
    container_name: dns
    restart: unless-stopped
    network_mode: "service:firewall"
    command:
      - dnsmasq
      - -k
      - --conf-file=/etc/dnsmasq.conf
      - --address=/tiny.com/${IP_MAQUINA1}     # incluye www.tiny.com
    depends_on:
      - firewall

  # ------------------------------------------------------------------
  # MIDDLEWARE (192.168.1.5): identifica al usuario y enruta a su cliente
  # ------------------------------------------------------------------
  middleware:
    build: ./middleware
    image: tiny-middleware:1.0
    container_name: middleware
    hostname: middleware
    restart: unless-stopped
    environment:
      LB_CLIENTE_A: http://192.168.1.6:8080
      LB_CLIENTE_B: http://192.168.1.7:8080
      CLIENTE_ANONIMO: A
      DOMINIOS: clientea.com:A,clienteb.com:B
      MIDDLEWARE_SECRETO: ${MIDDLEWARE_SECRETO}
      USUARIOS_DB_HOST: 192.168.1.9
      USUARIOS_DB_USER: middleware
      USUARIOS_DB_PASSWORD: ${MIDDLEWARE_DB_PASSWORD}
      TZ: America/Bogota
    networks:
      red_dmz: { ipv4_address: 192.168.1.5 }
    depends_on:
      usuarios-db: { condition: service_healthy }

  # ------------------------------------------------------------------
  # BD "Usuarios" (192.168.1.9): registro central usuario -> cliente
  # ------------------------------------------------------------------
  usuarios-db:
    image: mysql:8.0
    container_name: usuarios-db
    hostname: usuarios-db
    restart: unless-stopped
    mem_limit: 512m
    environment:
      MYSQL_ROOT_PASSWORD: ${USUARIOS_ROOT_PASSWORD}
      MYSQL_DATABASE: usuarios
      MIDDLEWARE_DB_PASSWORD: ${MIDDLEWARE_DB_PASSWORD}
      CONSUMER_DB_PASSWORD: ${CONSUMER_DB_PASSWORD}
      TZ: America/Bogota
    command: ["--innodb-buffer-pool-size=64M", "--performance-schema=OFF"]
    volumes:
      - usuarios-datos:/var/lib/mysql
      - ./usuarios-db:/docker-entrypoint-initdb.d:ro
    networks:
      red_dmz: { ipv4_address: 192.168.1.9 }
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  # ------------------------------------------------------------------
  # BROKER DE MENSAJERIA (192.168.1.8 | 192.168.2.8) - RabbitMQ
  # ------------------------------------------------------------------
  broker:
    image: rabbitmq:3.13-management
    container_name: broker
    hostname: broker
    restart: unless-stopped
    mem_limit: 512m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - broker-datos:/var/lib/rabbitmq
    ports:
      - "15672:15672"   # consola web de RabbitMQ (demo)
    networks:
      red_dmz:     { ipv4_address: 192.168.1.8 }
      red_interna: { ipv4_address: 192.168.2.8 }
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # ------------------------------------------------------------------
  # CONSUMER (192.168.1.10): Broker -> BD Usuarios
  # ------------------------------------------------------------------
  consumer:
    build: ./consumer
    image: tiny-consumer:1.0
    container_name: consumer
    hostname: consumer
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: 192.168.1.8
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      USUARIOS_DB_HOST: 192.168.1.9
      USUARIOS_DB_USER: consumer
      USUARIOS_DB_PASSWORD: ${CONSUMER_DB_PASSWORD}
      TZ: America/Bogota
    networks:
      red_dmz: { ipv4_address: 192.168.1.10 }
    depends_on:
      broker:      { condition: service_healthy }
      usuarios-db: { condition: service_healthy }

  # ------------------------------------------------------------------
  # LOAD BALANCER CLIENTE A (192.168.1.6) y CLIENTE B (192.168.1.7)
  # ------------------------------------------------------------------
  lb-cliente-a:
    image: haproxy:3.0-alpine
    container_name: lb-cliente-a
    hostname: lb-cliente-a
    restart: unless-stopped
    volumes:
      - ./balanceadores/lb-cliente-a.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8404:8404"     # estadisticas LB Cliente A
    networks:
      red_dmz: { ipv4_address: 192.168.1.6 }

  lb-cliente-b:
    image: haproxy:3.0-alpine
    container_name: lb-cliente-b
    hostname: lb-cliente-b
    restart: unless-stopped
    volumes:
      - ./balanceadores/lb-cliente-b.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8405:8404"     # estadisticas LB Cliente B
    networks:
      red_dmz: { ipv4_address: 192.168.1.7 }

  # ------------------------------------------------------------------
  # CLUSTER SERVIDOR APLICACION TinyCRM - CLIENTE A (3 instancias)
  # ------------------------------------------------------------------
  tinycrm-a1:
    <<: *tinycrm-base
    container_name: tinycrm-a1
    hostname: tinycrm-a1
    environment:
      <<: *env-cliente-a
      INSTANCIA: tinycrm-a1
    networks:
      red_dmz:     { ipv4_address: 192.168.1.3 }
      red_interna: { ipv4_address: 192.168.2.3 }
    depends_on:
      lb-bd:  { condition: service_started }
      broker: { condition: service_healthy }

  tinycrm-a2:
    <<: *tinycrm-base
    container_name: tinycrm-a2
    hostname: tinycrm-a2
    environment:
      <<: *env-cliente-a
      INSTANCIA: tinycrm-a2
    networks:
      red_dmz:     { ipv4_address: 192.168.1.13 }
      red_interna: { ipv4_address: 192.168.2.13 }
    depends_on:
      tinycrm-a1: { condition: service_healthy }   # evita crear las tablas dos veces a la vez

  tinycrm-a3:
    <<: *tinycrm-base
    container_name: tinycrm-a3
    hostname: tinycrm-a3
    environment:
      <<: *env-cliente-a
      INSTANCIA: tinycrm-a3
    networks:
      red_dmz:     { ipv4_address: 192.168.1.23 }
      red_interna: { ipv4_address: 192.168.2.23 }
    depends_on:
      tinycrm-a1: { condition: service_healthy }

  # ------------------------------------------------------------------
  # CLUSTER SERVIDOR APLICACION TinyCRM - CLIENTE B (3 instancias)
  # ------------------------------------------------------------------
  tinycrm-b1:
    <<: *tinycrm-base
    container_name: tinycrm-b1
    hostname: tinycrm-b1
    environment:
      <<: *env-cliente-b
      INSTANCIA: tinycrm-b1
    networks:
      red_dmz:     { ipv4_address: 192.168.1.4 }
      red_interna: { ipv4_address: 192.168.2.4 }
    depends_on:
      lb-bd:  { condition: service_started }
      broker: { condition: service_healthy }

  tinycrm-b2:
    <<: *tinycrm-base
    container_name: tinycrm-b2
    hostname: tinycrm-b2
    environment:
      <<: *env-cliente-b
      INSTANCIA: tinycrm-b2
    networks:
      red_dmz:     { ipv4_address: 192.168.1.14 }
      red_interna: { ipv4_address: 192.168.2.14 }
    depends_on:
      tinycrm-b1: { condition: service_healthy }

  tinycrm-b3:
    <<: *tinycrm-base
    container_name: tinycrm-b3
    hostname: tinycrm-b3
    environment:
      <<: *env-cliente-b
      INSTANCIA: tinycrm-b3
    networks:
      red_dmz:     { ipv4_address: 192.168.1.24 }
      red_interna: { ipv4_address: 192.168.2.24 }
    depends_on:
      tinycrm-b1: { condition: service_healthy }

  # ------------------------------------------------------------------
  # LOAD BALANCER BD (192.168.2.1)
  # ------------------------------------------------------------------
  lb-bd:
    image: haproxy:3.0-alpine
    container_name: lb-bd
    hostname: lb-bd
    restart: unless-stopped
    volumes:
      - ./balanceadores/lb-bd.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      red_interna: { ipv4_address: 192.168.2.1 }
    depends_on:
      pxc1: { condition: service_healthy }

  # ------------------------------------------------------------------
  # CLUSTER DB (192.168.2.10-12) - Percona XtraDB Cluster (Galera)
  # Replicacion sincrona: los 3 nodos tienen siempre los mismos datos
  # ------------------------------------------------------------------
  pxc1:
    <<: *pxc-base
    container_name: pxc1
    hostname: pxc1
    environment:
      <<: *pxc-env
      PXC_BOOTSTRAP: "1"
    volumes:
      - pxc1-datos:/var/lib/mysql
      - ./cluster-bd/pxc-arranque.sh:/usr/local/bin/pxc-arranque.sh:ro
      - ./cluster-bd/init:/docker-entrypoint-initdb.d:ro
    networks:
      red_interna: { ipv4_address: 192.168.2.10 }

  pxc2:
    <<: *pxc-base
    container_name: pxc2
    hostname: pxc2
    environment:
      <<: *pxc-env
    volumes:
      - pxc2-datos:/var/lib/mysql
      - ./cluster-bd/pxc-arranque.sh:/usr/local/bin/pxc-arranque.sh:ro
    networks:
      red_interna: { ipv4_address: 192.168.2.11 }
    depends_on:
      pxc1: { condition: service_healthy }

  pxc3:
    <<: *pxc-base
    container_name: pxc3
    hostname: pxc3
    environment:
      <<: *pxc-env
    volumes:
      - pxc3-datos:/var/lib/mysql
      - ./cluster-bd/pxc-arranque.sh:/usr/local/bin/pxc-arranque.sh:ro
    networks:
      red_interna: { ipv4_address: 192.168.2.12 }
    depends_on:
      pxc2: { condition: service_healthy }

networks:
  red_externa:
    external: true
  red_dmz:
    external: true
  red_interna:
    external: true

volumes:
  pxc1-datos:
  pxc2-datos:
  pxc3-datos:
  usuarios-datos:
  broker-datos:
