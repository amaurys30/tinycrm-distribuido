# =====================================================================
# DNS (192.168.0.1) - corre en la MAQUINA 1 compartiendo la red del
# firewall. Resuelve www.tiny.com -> IP del portatil 1 (se pasa en el
# docker-compose con la variable IP_MAQUINA1 del .env).
# =====================================================================
# Escucha en las dos IPs del firewall: Docker Desktop puede entregar el
# trafico del puerto 53 publicado a cualquiera de ellas
listen-address=192.168.0.1,192.168.1.1
bind-interfaces
no-resolv
no-hosts
# tiny.com es un dominio REAL en Internet: lo declaramos "local" para que
# NUNCA se pregunte a Internet por el (ni por IPv6/AAAA). Solo vale la
# respuesta configurada (--address en docker-compose: IP del portatil 1)
local=/tiny.com/
# Cualquier otro nombre se reenvia a Internet
server=8.8.8.8
server=1.1.1.1
log-queries
log-facility=-
