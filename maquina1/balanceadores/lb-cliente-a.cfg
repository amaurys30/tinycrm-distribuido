# =====================================================================
# Load Balancer Cliente A  (192.168.1.6)
# Reparte el trafico del cliente A entre las instancias de SU cluster
# TinyCRM. Health checks activos: si una instancia cae se retira sola.
# =====================================================================
global
    log stdout format raw local0 info
    maxconn 2000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option forwardfor
    timeout connect 3s
    timeout client  60s
    timeout server  60s
    # Si una instancia falla al conectar, reintentar en la otra
    retries 3
    option redispatch
    retry-on conn-failure empty-response

frontend fe_cliente_a
    bind *:8080
    default_backend be_tinycrm_a

backend be_tinycrm_a
    balance roundrobin
    option httpchk GET /actuator/health
    http-check expect status 200
    default-server inter 3s fall 2 rise 2 slowstart 10s
    # Para la demo: cabecera con la instancia que atendio la peticion
    http-response set-header X-Servidor %[srv_name]
    server tinycrm-a1 192.168.1.3:8080 check
    server tinycrm-a2 192.168.1.13:8080 check
    server tinycrm-a3 192.168.1.23:8080 check

# Panel de estadisticas: http://<IP-maquina1>:8404
listen estadisticas
    bind *:8404
    stats enable
    stats uri /
    stats refresh 3s
    stats show-legends
