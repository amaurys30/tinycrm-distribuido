# =====================================================================
# Load Balancer Cliente B  (192.168.1.7)
# Reparte el trafico del cliente B entre las instancias de SU cluster
# TinyCRM. Health checks activos: si una instancia cae se retira sola.
# =====================================================================
global
    log stdout format raw local0 info
    maxconn 2000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option forwardfor
    timeout connect 3s
    timeout client  60s
    timeout server  60s
    # Si una instancia falla al conectar, reintentar en la otra
    retries 3
    option redispatch
    retry-on conn-failure empty-response

frontend fe_cliente_b
    bind *:8080
    default_backend be_tinycrm_b

backend be_tinycrm_b
    balance roundrobin
    option httpchk GET /actuator/health
    http-check expect status 200
    default-server inter 3s fall 2 rise 2 slowstart 10s
    # Para la demo: cabecera con la instancia que atendio la peticion
    http-response set-header X-Servidor %[srv_name]
    server tinycrm-b1 192.168.1.4:8080 check
    server tinycrm-b2 192.168.1.14:8080 check
    server tinycrm-b3 192.168.1.24:8080 check

# Panel de estadisticas: http://<IP-maquina1>:8405
listen estadisticas
    bind *:8404
    stats enable
    stats uri /
    stats refresh 3s
    stats show-legends
