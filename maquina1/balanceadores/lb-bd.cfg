# =====================================================================
# Load Balancer BD (192.168.2.1) frente al Cluster DB Percona XtraDB
# (Galera, replicacion sincrona multi-maestro: 192.168.2.10-12).
# Patron recomendado para Galera: UN nodo escritor activo y los otros
# dos de respaldo (backup). Si pxc1 cae, pxc2 toma el trafico de
# inmediato; sus datos son identicos gracias a la replicacion sincrona.
# =====================================================================
global
    log stdout format raw local0 info
    maxconn 2000

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 3s
    # conexiones JDBC de larga vida (pool Hikari)
    timeout client  1h
    timeout server  1h

listen cluster_bd
    bind *:3306
    mode tcp
    option mysql-check user haproxy_check post-41
    default-server inter 2s fall 2 rise 3 on-marked-down shutdown-sessions
    server pxc1 192.168.2.10:3306 check
    server pxc2 192.168.2.11:3306 check backup
    server pxc3 192.168.2.12:3306 check backup

listen estadisticas
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 3s
