# =====================================================================
# TinyCRM - configuracion para la arquitectura distribuida multi-cliente
# Todos los valores ${...} se sobreescriben con variables de entorno
# desde docker-compose (ver maquina1/docker-compose.yml)
# =====================================================================

# ---- Identidad del cliente (tenant) y de la instancia ----
app.tenant.id=${TENANT_ID:A}
app.tenant.nombre=${TENANT_NOMBRE:Cliente A}
app.tenant.dominio=${TENANT_DOMINIO:clientea.com}
app.instancia=${INSTANCIA:local}

# ---- Base de datos: SIEMPRE a traves del Load Balancer BD (192.168.2.1) ----
spring.datasource.url=${DB_URL:jdbc:mysql://192.168.2.1:3306/tinycrm_cliente_a?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:tinycrm_a}
spring.datasource.password=${DB_PASSWORD:tinycrm_a_pwd}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Reconexion rapida cuando el LB BD cambia de nodo del cluster
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ---- Sesiones compartidas entre instancias (tolerancia a fallos) ----
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.timeout=24h
server.servlet.session.timeout=24h
server.servlet.session.cookie.name=TINYCRM_SESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.max-age=86400

# ---- Broker de mensajeria (RabbitMQ) ----
spring.rabbitmq.host=${RABBITMQ_HOST:192.168.2.8}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:tinycrm}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:tinycrm_pwd}
spring.rabbitmq.connection-timeout=5000
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.max-attempts=3
spring.rabbitmq.template.retry.initial-interval=1000
app.eventos.exchange=tinycrm.usuarios
app.eventos.cola=usuarios.sincronizacion

# ---- Actuator (health check usado por HAProxy) ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# Si el broker cae, la aplicacion debe seguir sirviendo (no marcar DOWN)
management.health.rabbit.enabled=false

# ---- Frontend Vue servido por la misma instancia (/app/static) ----
spring.web.resources.add-mappings=false
app.frontend.dir=${FRONTEND_DIR:file:/app/static/}

# ---- Tareas propias de TinyCRM ----
app.session.cleanup.enabled=true
app.session.cleanup.interval=3600000

spring.application.name=TinyCRM
logging.level.com.spkd.tinycrm=INFO
